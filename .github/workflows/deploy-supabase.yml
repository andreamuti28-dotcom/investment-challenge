# Deploys database changes and edge functions to Supabase on every push to main
# that touches the supabase/ folder. Needs three repository secrets:
#   SUPABASE_ACCESS_TOKEN  (supabase.com > Account > Access Tokens)
#   SUPABASE_PROJECT_REF   (the id in https://<ref>.supabase.co)
#   SUPABASE_DB_PASSWORD   (the database password chosen when creating the project)
name: Deploy Supabase
# Manual only: the project is already deployed. Run it after changing supabase/ files.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Engine tests must pass before deploying
        run: node --experimental-strip-types --test tests/*.test.ts
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase db push
      - run: supabase functions deploy engine --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase functions deploy market-data --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase functions deploy admin --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
